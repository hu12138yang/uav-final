[global]
# IEEE1588-2008, IPv4 UDP, software timestamping: master uses CLOCK_REALTIME/UTC.
# Keep software mode; hardware mode needs explicit PHC/TAI-to-UTC handling.
network_transport UDPv4
delay_mechanism E2E
time_stamping software
domainNumber 0
twoStepFlag 1
priority1 100
priority2 100
clockClass 248
logAnnounceInterval 0
logSyncInterval -3
logging_level 6
